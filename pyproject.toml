[project]
name = "transcriber"
version = "0.1.0"
description = "Transcription with speaker separation, language detection, translation and pluggable adapters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frank Reis" }]
dependencies = [
    "accelerate>=1.15.0",
    "av<17",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "flet>=1.0.5",
    "numpy>=2.5.4",
    "pyannote-audio<4",
    "pydantic>=2.9",
    "python-multipart>=0.0.33",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.2",
    "torch<2.9",
    "torchaudio<2.9",
    "transformers>=5.21.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
transcriber = "transcriber.cli:app"

[project.entry-points."transcriber.adapters"]
builtin = "transcriber.adapters.builtin:register"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: braucht echte Modelle und Netz (nicht im Standardlauf)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Diese Pakete liefern keine Typangaben. Der eigene Code bleibt streng geprüft.
module = [
    "av.*",
    "faster_whisper.*",
    "flet.*",
    "pyannote.*",
    "sounddevice.*",
    "speechbrain.*",
    "torch.*",
    "torchaudio.*",
    "transformers.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer braucht Funktionsaufrufe als Default (B008), das ist kein Fehler.
"src/transcriber/cli.py" = ["B008"]
# FastAPI braucht File(...) als Default, wie Typer (B008).
"src/transcriber/service.py" = ["B008"]
# SIM905 würde die Sprachliste in eine sehr lange Zeile zurückbauen (E501).
"src/transcriber/adapters/mapping.py" = ["SIM905"]
