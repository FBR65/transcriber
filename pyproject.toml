[project]
name = "transcriber"
version = "0.1.0"
description = "Transcription with speaker separation, language detection, translation and pluggable adapters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Frank Reis" }]
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
]

[project.scripts]
transcriber = "transcriber.cli:app"

[project.entry-points."transcriber.adapters"]
# Plug-ins melden sich hier an. Standard-Adapter folgen in P1.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer braucht Funktionsaufrufe als Default (B008), das ist kein Fehler.
"src/transcriber/cli.py" = ["B008"]
