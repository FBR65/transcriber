[project]
name = "transcriber-demo-plugin"
version = "0.1.0"
description = "Beispiel-Plug-in: zeigt deterministische Adapter ohne ML"
requires-python = ">=3.12"
dependencies = ["transcriber"]

[project.entry-points."transcriber.adapters"]
demo = "demo_plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demo_plugin"]
